name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mora
            ext: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: mora
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mora
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mora
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mora
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
        shell: bash

      - name: Build mora CLI
        run: cargo build --release --target ${{ matrix.target }} --bin mora
        shell: bash

      - name: Build mora-lsp
        run: cargo build --release --target ${{ matrix.target }} --bin mora-lsp
        shell: bash

      - name: Package mora
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/mora${{ matrix.ext }} artifacts/
          cp target/${{ matrix.target }}/release/mora-lsp${{ matrix.ext }} artifacts/
          cd artifacts
          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            7z a ../mora-${{ matrix.target }}.zip mora.exe mora-lsp.exe
          else
            tar czf ../mora-${{ matrix.target }}.tar.gz mora mora-lsp
          fi

      - name: Upload mora CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mora-${{ matrix.target }}
          path: mora-${{ matrix.target }}.*

  docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mora:${{ github.ref_name }},mora:latest
          platforms: linux/amd64

      - name: Save Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker save mora:${{ github.ref_name }} | gzip > mora-docker-amd64.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: mora-docker
          path: mora-docker-amd64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create checksums
        id: checksums
        shell: bash
        run: |
          cd dist
          CHECKSUMS=$(find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \;)
          echo "$CHECKSUMS"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "sha256sums<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$CHECKSUMS" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            # Mora ${{ github.ref_name }}

            AI-native 静态类型语言，面向大模型底层、计算图与算子、大模型推理/训练与资源动态调控，兼具 Go 式云原生并发与纯 Mora HTTP/MCP 标准库。

            ## 核心特性

            - **一等张量与 5 项静态检查**: `Tensor<DType, Shape, Device>`（`f64`/`f32`/`f16`/`bf16`/`fp8`/`i64`..`i4`），编译期执行 DType / Shape / Device / Resource / Effect 静态校验
            - **原生计算图与自动微分**: `trace_dag` 算子融合（FlashAttention / RmsNormLinear / LinearAct / Elementwise）、反向 `grad` / 前向 `jvp` / 高阶 `grad^n` & HVP、零依赖 CUDA / Vulkan / Metal / SIMD 后端
            - **显存与资源动态调控**: `kv_page_allocator`（PagedAttention 页表、CoW `fork_seq`、硬配额、优先级抢占与水位线回调）与 64B 对齐 `memory_pool`
            - **Go 式云原生并发与标准库**: `spawn` / `channel<T>` / `select` / `context` / 异步 TCP，配套纯 Mora `std/net/http`（含 Router / Chunked / Keep-Alive / SSE）与 `std/mcp`
            - **零源码单二进制编译**: `mora build` 将主模块与导入闭包预编译为 `MORABC02` 二进制 `ControlProgram` 载荷并生成独立可执行文件

            ## 快速开始

            ```bash
            mora run examples/hm_basic_demo.mora
            mora build examples/hm_basic_demo.mora -o demo
            ./demo
            ```

            ## 文档

            - [README](https://github.com/Microbiosis/mora-lang#readme)

            ## SHA-256 Checksums
            ```
            ${{ steps.checksums.outputs.sha256sums }}
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
