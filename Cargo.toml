[workspace]
members = [".", "std/math/bigint"]
resolver = "2"

[package]
name = "mora"
version = "0.110.0"
edition = "2024"
# v0.51: build.rs 注入 MORAGIT_VERSION 给编译期 env!() 用
build = "build.rs"
authors = ["Mora contributors"]
description = "An AI-native statically-typed language for native neural networks, compute graphs, and cloud-native services"
license = "BSD-3-Clause"
keywords = ["ai-native", "tensor", "autograd", "compiler", "cloud-native"]
categories = ["development-tools", "parser-implementations"]

[lib]
name = "mora"
path = "src/lib.rs"

[[bin]]
name = "mora"
path = "src/main.rs"

[[bin]]
name = "mora-lsp"
path = "src/bin/lsp.rs"

# v0.110.0: 单二进制 `mora`（加 `mora-lsp`）；HTTP/MCP 等扩展包后续拆入独立标准库包。

[dependencies]
# v0.11: libc 用于进程控制、系统调用与底层内存原语
libc = { version = "0.2", features = ["extra_traits"] }
parking_lot = "0.12"
# v0.50.0 (P0-B): tokio async runtime (reserved for Wave 2 TaskScheduler + AsyncIoReactor)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }

[dev-dependencies]
# v0.53: property-based testing for formal semantics verification
proptest = "1.7"

[features]
# v0.110.0: 统一单引擎执行（CFG-SSA MIR + stackful VM + Tokio TaskScheduler / AsyncIoReactor），
# 无可切换的遗留 JIT 或持久化环境 feature gate。

# v0.104.6 D470：debug 构建的调试信息降档 —— 治「D 盘被编译产物吃满」。
#
# 现象（本机实测）：`cargo test --all-targets` 一次产生 **104 GB** 的
# `.pdb`。根因是本仓有 **319 个测试文件** ⇒ `--all-targets` 会为每个
# 集成测试编译一个独立二进制 ⇒ 每个拖一份**完整** PDB 调试符号
# （Windows 上单份 100–269 MB）。debug profile 默认 `debug = "full"`。
#
# 按 PDB 修改时间统计，104 GB 全部产生于一天之内（21 时 646 个 / 70.7 GB，
# 22 时 326 个 / 33.2 GB）—— 即反复跑全量测试线性累积，**永不回收**
# （cargo 只在同名产物被覆盖时才复用，不会因「测试二进制不再需要」而删）。
#
# 选 `"line-tables-only"` 而非 `0`/`"none"`：本仓大量缺陷分析依赖
# **panic 的 filename:line**（如 `src/flow.rs:154:61`），`debug = 0`
# 会让 backtrace 失去行号，诊断信息退化。`"line-tables-only"` 是 cargo
# 官方给出的「最小可用」档：保留行号，不含变量/参数级信息，
# PDB 体积下降一个数量级以上。
#
# 若某次调试确实需要看变量值，临时用 `CARGO_PROFILE_DEV_DEBUG=full` 覆盖。
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
# build script / proc-macro 不是运行时依赖，不需要调试信息
# （cargo 默认已是 debug = false；此处显式写出以免将来误改）。
debug = false

[lints.rust]
# v0.104.6：启用 Rust 1.99 新增的 `raw_borrows_via_references`（默认 allow）。
# 它盯的是「先物化一个中间引用、紧接着又退化成裸指针」这种写法 —— 白白背上
# 别名规则却不受益。首轮开启即命中 `src/typeck/hm/mod.rs` 的 `&a.task_expr as
# *const _`，已改写为 `&raw const a.task_expr`。
# 其余 1.98/1.99 新 lint（`unconditional_panic` 扩展、
# `suspicious_runtime_symbol_definitions`、`invalid_runtime_symbol_definitions`、
# `semicolon_in_expressions_from_non_local_macros`）本就是 warn/deny by default，
# 已被 CI 的 `-- -D warnings` 覆盖，无需在此重复声明。
raw_borrows_via_references = "warn"
